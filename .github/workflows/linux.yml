name: Linux

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 AM, 1st and 15th of every month


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        python-version: ["3.9"]
        compiler: ["g++-12"]
        include:
          - os: "ubuntu-22.04"
            python-version: "3.9"
            compiler: "g++-10"
          - os: "ubuntu-24.04"
            python-version: "3.9"
            compiler: "g++-14"
          - os: "ubuntu-24.04"
            python-version: "3.13"
            compiler: "g++-12"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: apt
        run: |
          sudo apt update
          sudo apt install libblas-dev liblapack-dev openmpi-bin libopenmpi-dev libscalapack-openmpi-dev

      - name: pip install
        run: |
          python -m pip install -U pip
          python -m pip install numpy scipy toml pytest

      - name: make workspace
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: cmake
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake -DCMAKE_CXX_COMPILER=${{matrix.compiler}} -DCMAKE_VERBOSE_MAKEFILE=ON $GITHUB_WORKSPACE

      - name: build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build ./ -j4

      # -j4 is the runner's vCPU count, which lscpu reports as two physical
      # cores with two threads each (AMD EPYC 7763).  Running the suite twice
      # in one job on 2026-09-08 measured -j2 at 218-244 s against -j4's
      # 214-241 s across all five jobs, so SMT is worth one to three percent
      # here and the cores are saturated either way: scheduling has nothing
      # left to give, and a shorter ctest has to come from less work.
      - name: ctest
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: OMP_NUM_THREADS=1 ctest -j4 -V
