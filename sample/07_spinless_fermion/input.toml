# Spinless free fermions on the square lattice (experimental fermion mode)
#
#   H = -t sum_<ij> (c_i^dag c_j + h.c.) - mu sum_i n_i,   t = 1.0, mu = 0.0
#
# The fermion mode currently supports only the expert-mode input
# (tenes_simple / tenes_std cannot generate fermionic inputs yet), so the
# imaginary-time evolution gates exp(-tau h_bond) are written out explicitly
# below. Gate elements are indexed as  in1 in2 out1 out2  and the
# chemical-potential term is split evenly over the four bonds touching a site.
#
# Exact ground-state energy per site at t=1, mu=0 (half filling): -0.81056
# Expected result of this sample (D=2, chi=8):  E = -0.7328, n = 0.5000
# With D=4, chi=32 the energy improves to about 0.7% relative error, but the
# two-site measurement is currently much slower at D=4.

[parameter]
[parameter.general]
is_real = true
fermion = true
output = "output"

[parameter.simple_update]
tau = 0.01
num_step = 1000

[parameter.ctm]
dimension = 8
convergence_epsilon = 1.0e-8
iteration_max = 100

[parameter.random]
seed = 11

[tensor]
L_sub = [2, 2]
skew = 0

[[tensor.unitcell]]
index = []
physical_dim = 2
virtual_dim = [2, 2, 2, 2]
# fermion parity of the physical basis {|0>, |1>}
parity = [0, 1]
initial_state = [0.0]
noise = 1.0

[observable]
[[observable.onesite]]
name = "n"
group = 0
sites = []
dim = 2
elements = """
1 1  1.0 0.0
"""

[[observable.twosite]]
name = "bond_hamiltonian"
group = 0
bonds = """
0 1 0
1 1 0
2 1 0
3 1 0
0 0 1
1 0 1
2 0 1
3 0 1
"""
dim = [2, 2]
elements = """
0 1 1 0  -1.00000000000000000e+00 0.0
1 0 0 1  -1.00000000000000000e+00 0.0
"""

[evolution]
[[evolution.simple]]
group = 0
source_site = 0
source_leg = 2
dimensions = [2, 2, 2, 2]
elements = """
0 0 0 0  1.00000000000000000e+00 0.0
0 1 0 1  1.00005000041666792e+00 0.0
0 1 1 0  1.00001666674998657e-02 0.0
